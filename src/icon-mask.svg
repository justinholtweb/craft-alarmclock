<?xml version="1.0" encoding="UTF-8"?>
<!--
  Control-panel nav icon. Craft paints this as a flat silhouette, so it is drawn as bold masses —
  two bells, a body, two feet — with the dial punched out by fill-rule rather than stroked. Thin
  strokes and a detailed dial disappear entirely at the ~16px this is actually seen at.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="currentColor" fill-rule="evenodd">
    <!-- bells -->
    <path d="M24.5 6.5c7.7 0 14 6.3 14 14 0 2.4-.6 4.6-1.7 6.6-4.6 1-8.8 3.1-12.3 6.1-3.5-3-7.7-5.1-12.3-6.1a13.9 13.9 0 0 1-1.7-6.6c0-7.7 6.3-14 14-14z"/>
    <path d="M75.5 6.5c7.7 0 14 6.3 14 14 0 2.4-.6 4.6-1.7 6.6-4.6 1-8.8 3.1-12.3 6.1-3.5-3-7.7-5.1-12.3-6.1a13.9 13.9 0 0 1-1.7-6.6c0-7.7 6.3-14 14-14z"/>

    <!-- hammer between them -->
    <path d="M45 8h10v11a5 5 0 0 1-10 0z"/>

    <!-- body, with the dial punched out -->
    <path d="M50 26c19.9 0 36 16.1 36 36S69.9 98 50 98 14 81.9 14 62s16.1-36 36-36zm0 9c-14.9 0-27 12.1-27 27s12.1 27 27 27 27-12.1 27-27-12.1-27-27-27z"/>

    <!-- feet -->
    <path d="M20 88.5l7.5 5.5-6 8.5-8-6zM80 88.5l6.5 8-8 6-6-8.5z"/>

    <!-- hands, at ten past ten: the angle every clock is drawn at, and the one that reads as a
         clock rather than a circle -->
    <path d="M47 41h6v22h-6z"/>
    <path d="M50 59.5l3.2 4.4-19 13.8-3.2-4.4z"/>
  </g>
</svg>
