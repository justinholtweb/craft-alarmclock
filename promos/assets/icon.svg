<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf.

  The dial is the tile showing through rather than a second colour, which keeps the whole mark to
  two inks and stops the face turning to mud at 32px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded tile: 22.44% radius, matching Appleseed's rx="35" on a 156px square -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#C2610F"/>

  <!-- The clock, scaled to sit inside the tile with the family's margin -->
  <g transform="translate(8.985 4.667) scale(0.8205)">
    <g fill="#FEFEFE">
      <!-- bells -->
      <path d="M24.5 6.5c7.7 0 14 6.3 14 14 0 2.4-.6 4.6-1.7 6.6-4.6 1-8.8 3.1-12.3 6.1-3.5-3-7.7-5.1-12.3-6.1a13.9 13.9 0 0 1-1.7-6.6c0-7.7 6.3-14 14-14z"/>
      <path d="M75.5 6.5c7.7 0 14 6.3 14 14 0 2.4-.6 4.6-1.7 6.6-4.6 1-8.8 3.1-12.3 6.1-3.5-3-7.7-5.1-12.3-6.1a13.9 13.9 0 0 1-1.7-6.6c0-7.7 6.3-14 14-14z"/>

      <!-- hammer between them -->
      <path d="M45 8h10v11a5 5 0 0 1-10 0z"/>

      <!-- feet -->
      <path d="M20 88.5l7.5 5.5-6 8.5-8-6zM80 88.5l6.5 8-8 6-6-8.5z"/>

      <!-- case -->
      <circle cx="50" cy="62" r="36"/>
    </g>

    <!-- dial: the tile, not a third colour -->
    <circle cx="50" cy="62" r="27" fill="#C2610F"/>

    <!-- hands, at ten past ten: the angle every clock is drawn at, and the one that reads as a
         clock rather than a circle -->
    <g fill="#FEFEFE">
      <path d="M47 41h6v22h-6z"/>
      <path d="M50 59.5l3.2 4.4-19 13.8-3.2-4.4z"/>
    </g>
    <circle cx="50" cy="62" r="3.4" fill="#C2610F"/>
  </g>
</svg>
